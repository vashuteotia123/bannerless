# Anyone who forks this repo gets the same pipeline: tests on every push,
# and a downloadable Bannerless.zip attached to every tag (v1.0, v1.1, …).
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Test
        run: swift test
      - name: Build app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bannerless
          path: dist/Bannerless.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 dist/Bannerless.zip > dist/Bannerless.zip.sha256
          gh release create "$GITHUB_REF_NAME" dist/Bannerless.zip dist/Bannerless.zip.sha256 \
            --title "Bannerless $GITHUB_REF_NAME" --generate-notes
